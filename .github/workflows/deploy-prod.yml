name: "Deploy prod"

on:
  workflow_dispatch:
  push:
    branches:
      master
      
permissions:
  contents: read

jobs:
  deploy-prod:
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: DATABASE_URL secret is not set in repo secrets."
            exit 1
          fi
          echo "Running migrations..."
          npx drizzle-kit migrate --config ./drizzle-prod.config.ts

      - name: Install Vercel CLI
        run: npm install -g vercel
      
      - name: Deploy to Vercel (production)
        env:
          VERCEL_PROD_TOKEN: ${{ secrets.VERCEL_PROD_TOKEN }}
        run: |
          if [ -z "$VERCEL_PROD_TOKEN" ]; then
            echo "ERROR: VERCEL_PROD_TOKEN secret is not set in repo secrets."
            exit 1
          fi
          echo "Deploying branch: $(git rev-parse --abbrev-ref HEAD)..."
          vercel --prod --token "$VERCEL_PROD_TOKEN" --yes

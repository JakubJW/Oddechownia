name: "Manual: Trigger Vercel Deploy"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Show run info
        run: |
          echo "Manual Vercel deploy test"
          echo "Triggered by: ${{ github.actor }} / ${{ github.sha }}"

      - name: Trigger Vercel deploy via Deploy Hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_HOOK" ]; then
            echo "ERROR: VERCEL_DEPLOY_HOOK_URL secret not set."
            exit 1
          fi
          echo "Posting to Vercel deploy hook..."
          # include commit/meta to help debugging in Vercel logs if desired
          payload="{\"ref\":\"${GITHUB_REF:-'manual'}\",\"commit\":\"${GITHUB_SHA:-'manual'}\",\"actor\":\"${GITHUB_ACTOR}\"}"
          curl -sS -X POST "$VERCEL_HOOK" -H "Content-Type: application/json" -d "$payload" \
            || (echo "Deploy hook POST failed" && exit 1)
          echo "Deploy hook POSTed. Check Vercel dashboard for the new deployment."

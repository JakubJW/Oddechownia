name: "Manual: Deploy to Vercel (Development)"

# Run manually or automatically on pushes to dev
on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  deploy-dev:
    environment: Development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN secret is not set in repo secrets."
            exit 1
          fi
          echo "Deploying branch: $(git rev-parse --abbrev-ref HEAD)"
          # No --prod -> preview deployment of the currently checked-out branch
          vercel --token "$VERCEL_TOKEN" --yes --target=preview
